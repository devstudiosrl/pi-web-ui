# Build a tagged Printalo release and attach the tarball to it.
#
# The server installs pi-web-ui from this asset, not from npm: npm carries
# upstream's package, and this fork is not going to publish a competing name
# there. One tag, one build, one file - and the version in ddra points at it.
name: release

on:
  push:
    tags:
      - "v*-printalo.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      # The same three checks as sync-upstream.sh, because a tag can also be
      # pushed by hand and a release nobody built is a release nobody tested.
      # Build before test, as upstream's CI does: some tests import dist/
      # (systemd-install runs bin/pi-web-ui.mjs, which loads the built server).
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Pack
        id: pack
        run: |
          file="$(npm pack --silent)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -l "$file"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          {
            echo "pi-web-ui as Printalo ships it - see PATCHES.md."
            echo
            echo "Install:"
            echo
            echo "    npm i -g --allow-scripts=node-pty https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$FILE"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$FILE" --title "$GITHUB_REF_NAME" --notes-file notes.md
